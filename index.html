<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Home Renovation Tracker</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="css/styles.css">
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">
  <div class="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-slate-200">
    <div class="text-center mb-6">
      <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center mx-auto mb-3 text-2xl">
        🏡
      </div>
      <h1 class="text-2xl font-bold text-slate-800">Renovation Tracker</h1>
      <p class="text-sm text-slate-500 mt-1">Enter your project access passcode</p>
    </div>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-xs font-semibold text-slate-600 uppercase tracking-wider mb-1.5">Access Passcode</label>
        <input 
          type="password" 
          id="passcodeInput" 
          placeholder="Enter passcode (e.g. admin123)" 
          required 
          autocomplete="current-password"
          class="w-full px-3.5 py-2.5 rounded-lg border border-slate-300 focus:outline-none focus:ring-2 focus:ring-blue-500 text-slate-800"
        />
      </div>

      <div id="loginError" class="text-rose-600 text-sm hidden p-2.5 bg-rose-50 rounded-lg"></div>

      <button 
        type="submit" 
        id="loginBtn"
        class="w-full bg-blue-600 text-white py-2.5 rounded-lg font-semibold hover:bg-blue-700 transition shadow-sm"
      >
        Sign In
      </button>
    </form>

    <div class="mt-6 pt-6 border-t border-slate-100 text-xs text-slate-400 text-center leading-relaxed">
      Data is synced in real-time with Google Sheets & Drive.<br>
      Contact project admin if you need your access passcode.
    </div>
  </div>

  <script type="module">
    import { API_URL } from './js/api.js';
    import { setSession, getSession } from './js/auth.js';

    if (getSession()) {
      window.location.href = "dashoard.html";
    }

    const form = document.getElementById("loginForm");
    const errorBox = document.getElementById("loginError");
    const btn = document.getElementById("loginBtn");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      errorBox.classList.add("hidden");
      btn.disabled = true;
      btn.innerHTML = `<span class="spinner"></span> Verifying...`;

      const passcode = document.getElementById("passcodeInput").value.trim();

      try {
        const res = await fetch(`${API_URL}?action=getReport&passcode=${encodeURIComponent(passcode)}`);
        const json = await res.json();

        if (json.status === 200 && json.data?.user) {
          setSession(json.data.user, passcode);
          window.location.href = "dashboard.html";
        } else {
          errorBox.innerText = json.data?.error || "Invalid passcode. Please try again.";
          errorBox.classList.remove("hidden");
        }
      } catch (err) {
        errorBox.innerText = "Network error: Make sure API_URL in js/api.js is configured.";
        errorBox.classList.remove("hidden");
      } finally {
        btn.disabled = false;
        btn.innerText = "Sign In";
      }
    });
  </script>
</body>
</html>
